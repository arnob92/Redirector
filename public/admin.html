<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>City Admin – Dark Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --muted: #9aa7b2; }
    body { background: linear-gradient(180deg,#041023 0%, #071827 100%); }
    .glass { background: rgba(255,255,255,0.02); }
    .muted { color: var(--muted); }
    #tokenHotspot { position: fixed; right: 16px; top: 12px; width: 28px; height: 28px; z-index: 60; border-radius: 6px; }
    #tokenHotspot:hover { outline: 2px solid rgba(255,255,255,0.03); cursor: pointer; }
    #tokenInputInvisible { position: fixed; right: 18px; top: 14px; width: 200px; height: 24px; opacity: 0; color:transparent; background:transparent; border:none; z-index:61; outline:none; }
    #tokenPanel { position: fixed; right: 16px; top: 8px; z-index:70; display:none; }
  </style>
</head>
<body class="text-slate-100 font-inter antialiased">
  <div class="max-w-7xl mx-auto p-6">
    <header class="flex items-center gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-semibold">City Management – Admin (Dark)</h1>
        <p class="muted text-sm">Country → State → City. Edit lat/lon/link and manage structure.</p>
      </div>

      <div class="flex-1"></div>

      <div id="tokenPanel" class="glass p-2 rounded-md shadow-sm">
        <div class="flex items-center gap-2">
          <input id="tokenVisible" class="px-3 py-1 rounded bg-transparent border border-white/6 text-sm" placeholder="Paste admin token, press Enter" />
          <button id="btnTokenClose" class="px-3 py-1 rounded bg-white/5 text-sm">Hide</button>
        </div>
      </div>

      <div id="tokenHotspot" title="Click to reveal token input">
        <svg class="h-6 w-6 text-white/6" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 15v2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="4" y="10" width="16" height="10" rx="2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 10V7a4 4 0 018 0v3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <input id="tokenInputInvisible" autocomplete="off" />

    </header>

    <main class="grid grid-cols-12 gap-6">
      <section class="col-span-7 glass rounded-xl p-4 h-[72vh] overflow-auto">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm muted">Explorer</div>
          <div class="flex gap-2">
            <button id="btnAddCountry" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-sm">+ Country</button>
            <button id="btnReload" class="px-3 py-1 rounded bg-white/5 text-sm">Reload</button>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-xs muted mb-1">INTERNATIONAL_LINK</label>
          <div class="flex gap-2">
            <input id="internationalLink" class="flex-1 px-3 py-2 rounded bg-transparent border border-white/6 text-sm" placeholder="https://example.com/international" />
            <button id="btnSaveIntlLink" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-700 text-sm">Save</button>
          </div>
        </div>

        <div id="listBox" class="space-y-2"></div>
      </section>

      <section class="col-span-5 glass rounded-xl p-5 h-[72vh] overflow-auto">
        <div id="editorEmpty" class="h-full flex flex-col items-center justify-center muted">
          <div class="text-lg">No item selected</div>
          <div class="text-sm mt-2">Select a country / state / city from the left to edit its details.</div>
        </div>

        <div id="editorPanel" class="hidden">
          <div class="flex items-center justify-between mb-3">
            <div>
              <div id="editPath" class="text-xs muted"></div>
              <h2 id="editTitle" class="text-xl font-semibold"></h2>
            </div>
            <div class="flex gap-2">
              <button id="btnAddChild" class="px-3 py-1 rounded bg-emerald-600 text-sm">Add Child</button>
              <button id="btnDelete" class="px-3 py-1 rounded bg-red-600 text-sm">Delete</button>
            </div>
          </div>

          <div class="space-y-3">
            <div>
              <label class="text-xs muted">Name</label>
              <input id="fieldName" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
            </div>
            <div>
              <label class="text-xs muted">Code / Key (country or state)</label>
              <input id="fieldCode" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
            </div>

            <div id="cityFields" class="hidden">
              <label class="text-xs muted">Link</label>
              <input id="fieldLink" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              <div class="grid grid-cols-2 gap-3 mt-2">
                <div>
                  <label class="text-xs muted">Latitude</label>
                  <input id="fieldLat" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
                </div>
                <div>
                  <label class="text-xs muted">Longitude</label>
                  <input id="fieldLon" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
                </div>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <button id="btnUpdate" class="px-4 py-2 rounded bg-blue-600">Update</button>
              <button id="btnReset" class="px-4 py-2 rounded border border-white/10">Reset</button>
              <div id="editorNote" class="muted text-sm"></div>
            </div>

            <div>
              <label class="text-xs muted">Raw JSON (preview)</label>
              <pre id="rawPreview" class="bg-black/30 text-xs p-3 rounded max-h-48 overflow-auto"></pre>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="fixed right-6 bottom-6 hidden items-center gap-3 bg-slate-900/80 border border-white/6 text-sm px-4 py-3 rounded">
    <div id="toastText"></div>
    <button id="toastClose" class="text-white/60">✕</button>
  </div>

<script>
let citiesData = null;
let selected = null;
let adminToken = null;
let originalData = null; // Store original data for comparison

const listBox = document.getElementById('listBox');
const btnAddCountry = document.getElementById('btnAddCountry');
const btnReload = document.getElementById('btnReload');
const internationalLinkInput = document.getElementById('internationalLink');
const btnSaveIntlLink = document.getElementById('btnSaveIntlLink');

const editorEmpty = document.getElementById('editorEmpty');
const editorPanel = document.getElementById('editorPanel');
const editPath = document.getElementById('editPath');
const editTitle = document.getElementById('editTitle');
const fieldName = document.getElementById('fieldName');
const fieldCode = document.getElementById('fieldCode');
const cityFields = document.getElementById('cityFields');
const fieldLink = document.getElementById('fieldLink');
const fieldLat = document.getElementById('fieldLat');
const fieldLon = document.getElementById('fieldLon');
const rawPreview = document.getElementById('rawPreview');

const btnAddChild = document.getElementById('btnAddChild');
const btnDelete = document.getElementById('btnDelete');
const btnUpdate = document.getElementById('btnUpdate');
const btnReset = document.getElementById('btnReset');

const tokenHotspot = document.getElementById('tokenHotspot');
const tokenInputInvisible = document.getElementById('tokenInputInvisible');
const tokenPanel = document.getElementById('tokenPanel');
const tokenVisible = document.getElementById('tokenVisible');
const btnTokenClose = document.getElementById('btnTokenClose');

const toast = document.getElementById('toast');
const toastText = document.getElementById('toastText');
const toastClose = document.getElementById('toastClose');

function showToast(msg, t=3000){
  toastText.textContent = msg;
  toast.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.add('hidden'), t);
}
toastClose.onclick = ()=> { toast.classList.add('hidden'); clearTimeout(toast._t); };

function safeKeys(obj){ return Object.keys(obj||{}).filter(k=>k!=='INTERNATIONAL_LINK'); }
function ensureData(){ if(!citiesData) citiesData = { INTERNATIONAL_LINK: '' }; if(!('INTERNATIONAL_LINK' in citiesData)) citiesData.INTERNATIONAL_LINK = ''; }
function isValidCoord(x){ 
  return x === '' || x === null || x === undefined || /^-?\d+(\.\d+)?$/.test(String(x).trim()); 
}
function headersWithToken(){
  return { 'Content-Type': 'application/json', 'x-admin-token': adminToken || '' };
}

// Normalize value for comparison
function normalizeValue(val) {
  if (val === null || val === undefined || val === '') return '';
  return String(val);
}

tokenHotspot.addEventListener('click', ()=> {
  tokenPanel.style.display = tokenPanel.style.display === 'block' ? 'none' : 'block';
  if(tokenPanel.style.display === 'block') tokenVisible.focus();
});

tokenInputInvisible.addEventListener('keydown', (e)=> {
  if(e.key === 'Enter') {
    adminToken = tokenInputInvisible.value.trim();
    tokenVisible.value = adminToken;
    tokenPanel.style.display = 'none';
    loadCities();
  }
});

tokenInputInvisible.addEventListener('blur', ()=> {
  setTimeout(()=> {
    if(tokenInputInvisible.value && tokenInputInvisible.value.trim()){
      adminToken = tokenInputInvisible.value.trim();
      tokenVisible.value = adminToken;
      tokenPanel.style.display = 'none';
      loadCities();
    }
  }, 150);
});

tokenVisible.addEventListener('keydown', (e)=> {
  if(e.key === 'Enter') {
    adminToken = tokenVisible.value.trim();
    tokenPanel.style.display = 'none';
    loadCities();
  }
});
btnTokenClose.addEventListener('click', ()=> { tokenPanel.style.display = 'none'; });

function renderExplorer(){
  listBox.innerHTML = '';
  if(!citiesData){ listBox.innerHTML = '<div class="muted text-sm">No data loaded</div>'; return; }

  const keys = safeKeys(citiesData);
  if(keys.length === 0) { listBox.innerHTML = '<div class="muted text-sm">No countries</div>'; return; }

  keys.forEach(countryKey => {
    const countryBox = document.createElement('div');
    countryBox.className = 'p-3 rounded hover:bg-white/2 flex items-center justify-between cursor-pointer';
    if(selected && selected.type==='country' && selected.countryKey===countryKey) countryBox.classList.add('ring-2','ring-blue-600','bg-white/2');
    
    countryBox.onclick = ()=> selectCountry(countryKey);

    const left = document.createElement('div');
    left.innerHTML = `<div class="font-medium">${countryKey}</div><div class="text-xs muted">${(citiesData[countryKey]||[]).length} states</div>`;

    const right = document.createElement('div');
    const addStateBtn = document.createElement('button'); addStateBtn.className='text-sm px-2 py-1 rounded bg-emerald-600'; addStateBtn.textContent='+ State';
    addStateBtn.onclick = (e)=> { e.stopPropagation(); selectCountry(countryKey); addState(countryKey); };

    right.appendChild(addStateBtn);
    countryBox.appendChild(left); countryBox.appendChild(right);
    listBox.appendChild(countryBox);

    const states = citiesData[countryKey] || [];
    states.forEach((st, si) => {
      const stDiv = document.createElement('div');
      stDiv.className = 'ml-4 p-2 rounded hover:bg-white/3 flex items-center justify-between cursor-pointer';
      if(selected && selected.type==='state' && selected.countryKey===countryKey && selected.stateIndex===si) stDiv.classList.add('ring-2','ring-blue-500','bg-white/3');
      
      stDiv.onclick = ()=> selectState(countryKey, si);

      const stLeft = document.createElement('div');
      stLeft.innerHTML = `<div class="font-medium">${escapeHtml(st.name || '(unnamed)')}</div><div class="text-xs muted">${Array.isArray(st.cities)?st.cities.length:0} cities</div>`;

      const stRight = document.createElement('div');
      const addCityBtn = document.createElement('button'); addCityBtn.className='text-sm px-2 py-1 rounded bg-emerald-600'; addCityBtn.textContent='+ City';
      addCityBtn.onclick = (e)=> { e.stopPropagation(); selectState(countryKey, si); addCity(countryKey, si); };

      stRight.appendChild(addCityBtn);
      stDiv.appendChild(stLeft); stDiv.appendChild(stRight);
      listBox.appendChild(stDiv);

      if(Array.isArray(st.cities)) st.cities.forEach((ct, ci) => {
        const ctDiv = document.createElement('div');
        ctDiv.className = 'ml-8 p-2 rounded hover:bg-white/4 cursor-pointer';
        if(selected && selected.type==='city' && selected.countryKey===countryKey && selected.stateIndex===si && selected.cityIndex===ci) ctDiv.classList.add('ring-2','ring-indigo-500','bg-white/4');

        const ctLeft = document.createElement('div');
        ctLeft.innerHTML = `<div class="font-medium">${escapeHtml(ct.name||'(unnamed)')}</div><div class="text-xs muted">link: ${escapeHtml(ct.link||'-')} • ${escapeHtml(String(ct.lat||'-'))}, ${escapeHtml(String(ct.lon||'-'))}</div>`;

        ctDiv.onclick = ()=> selectCity(countryKey, si, ci);
        ctDiv.appendChild(ctLeft);
        listBox.appendChild(ctDiv);
      });
    });

    const hr = document.createElement('div'); hr.className = 'border-t border-white/4 my-2';
    listBox.appendChild(hr);
  });
}

function selectCountry(countryKey){
  selected = { type:'country', countryKey };
  showEditor();
  renderExplorer();
}
function selectState(countryKey, stateIndex){
  selected = { type:'state', countryKey, stateIndex };
  showEditor();
  renderExplorer();
}
function selectCity(countryKey, stateIndex, cityIndex){
  selected = { type:'city', countryKey, stateIndex, cityIndex };
  showEditor();
  renderExplorer();
}

function showEditor(){
  if(!selected){ 
    editorPanel.classList.add('hidden'); 
    editorEmpty.classList.remove('hidden'); 
    originalData = null;
    return; 
  }
  editorEmpty.classList.add('hidden'); 
  editorPanel.classList.remove('hidden');

  if(selected.type==='country'){
    editPath.textContent = `Country • ${selected.countryKey}`;
    editTitle.textContent = 'Country';
    fieldName.value = selected.countryKey;
    fieldCode.value = selected.countryKey;
    cityFields.classList.add('hidden');
    rawPreview.textContent = JSON.stringify({ key: selected.countryKey }, null, 2);
    originalData = { name: selected.countryKey, code: selected.countryKey };
  } else if(selected.type==='state'){
    editPath.textContent = `State • ${selected.countryKey} / ${selected.stateIndex}`;
    editTitle.textContent = 'State';
    const st = (citiesData[selected.countryKey] && citiesData[selected.countryKey][selected.stateIndex]) || { name:'', code:'' };
    fieldName.value = st.name || '';
    fieldCode.value = st.code || '';
    cityFields.classList.add('hidden');
    rawPreview.textContent = JSON.stringify(st, null, 2);
    originalData = { name: st.name || '', code: st.code || '' };
  } else if(selected.type==='city'){
    editPath.textContent = `City • ${selected.countryKey} / ${selected.stateIndex} / ${selected.cityIndex}`;
    editTitle.textContent = 'City';
    const ct = (citiesData[selected.countryKey] && citiesData[selected.countryKey][selected.stateIndex] && citiesData[selected.countryKey][selected.stateIndex].cities && citiesData[selected.countryKey][selected.stateIndex].cities[selected.cityIndex]) || { name:'', link:'', lat:'', lon:'' };
    fieldName.value = ct.name || '';
    fieldCode.value = '';
    cityFields.classList.remove('hidden');
    fieldLink.value = ct.link || '';
    fieldLat.value = normalizeValue(ct.lat);
    fieldLon.value = normalizeValue(ct.lon);
    rawPreview.textContent = JSON.stringify(ct, null, 2);
    originalData = { 
      name: ct.name || '', 
      link: ct.link || '', 
      lat: normalizeValue(ct.lat), 
      lon: normalizeValue(ct.lon) 
    };
  }
}

async function addCountry(){
  const code = prompt('Country key (e.g. US)');
  if(!code) return;
  const initialStateName = prompt('Optional initial state name (display only)') || '';
  try {
    const res = await fetch('/api/country/add', { method: 'POST', headers: headersWithToken(), body: JSON.stringify({ code: code.toUpperCase(), initialStateName }) });
    const j = await res.json();
    if(!j.success) return showToast('Add country failed: ' + (j.error || res.status));
    await loadCities();
    showToast('Country added');
  } catch(e) { showToast('Add country error: ' + e.message); }
}

async function addState(countryKey){
  const name = prompt('State/region name');
  if(!name) return;
  try {
    const res = await fetch('/api/state/add', { method:'POST', headers: headersWithToken(), body: JSON.stringify({ country: countryKey, name, code: '' }) });
    const j = await res.json();
    if(!j.success) return showToast('Add state failed: ' + (j.error || res.status));
    await loadCities();
    const states = citiesData[countryKey] || [];
    selectState(countryKey, states.length - 1);
    showToast('State added');
  } catch(e){ showToast('Add state error: ' + e.message); }
}

async function addCity(countryKey, stateIndex){
  const name = prompt('City name');
  if(!name) return;
  const link = prompt('Link (URL)') || 'https://example.com';
  const lat = prompt('Latitude (optional)') || '';
  const lon = prompt('Longitude (optional)') || '';
  try {
    const state = (citiesData[countryKey] && citiesData[countryKey][stateIndex]);
    if(!state) return showToast('State not found');

    const res = await fetch('/api/city/add', { method:'POST', headers: headersWithToken(), body: JSON.stringify({ 
      country: countryKey, 
      stateName: state.name, 
      name, 
      lat: lat === '' ? '' : Number(lat), 
      lon: lon === '' ? '' : Number(lon), 
      link 
    })});
    const j = await res.json();
    if(!j.success) return showToast('Add city failed: ' + (j.error || res.status));
    await loadCities();
    const idx = (citiesData[countryKey][stateIndex].cities || []).length - 1;
    selectCity(countryKey, stateIndex, idx);
    showToast('City added');
  } catch(e){ showToast('Add city error: ' + e.message); }
}

btnAddChild.onclick = ()=> {
  if(!selected) return showToast('Select parent first');
  if(selected.type === 'country') addState(selected.countryKey);
  else if(selected.type === 'state') addCity(selected.countryKey, selected.stateIndex);
  else showToast('Cannot add child to city');
};

btnDelete.onclick = async ()=> {
  if(!selected) return showToast('Select something to delete');
  if(!confirm('Delete selected item?')) return;
  try {
    if(selected.type === 'country'){
      const res = await fetch('/api/country/delete', { method:'POST', headers: headersWithToken(), body: JSON.stringify({ code: selected.countryKey }) });
      const j = await res.json();
      if(!j.success) return showToast('Delete country failed: ' + (j.error || res.status));
      selected = null;
      await loadCities();
      showToast('Country deleted');
    } else if(selected.type === 'state'){
      const st = citiesData[selected.countryKey][selected.stateIndex];
      const res = await fetch('/api/state/delete', { method:'POST', headers: headersWithToken(), body: JSON.stringify({ country: selected.countryKey, stateName: st.name }) });
      const j = await res.json();
      if(!j.success) return showToast('Delete state failed: ' + (j.error || res.status));
      selected = null;
      await loadCities();
      showToast('State deleted');
    } else if(selected.type === 'city'){
      const st = citiesData[selected.countryKey][selected.stateIndex];
      const res = await fetch('/api/city/delete', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify({ 
          country: selected.countryKey, 
          stateName: st.name, 
          cityIndex: selected.cityIndex
        }) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Delete city failed: ' + (j.error || res.status));
      selected = null;
      await loadCities();
      showToast('City deleted');
    }
  } catch(e){ showToast('Delete error: ' + e.message); }
};

btnUpdate.onclick = async ()=> {
  if(!selected) return showToast('Select an item to update');
  
  // Store selection before any async operations
  const savedSelection = { ...selected };
  
  try {
    if(selected.type === 'city'){
      const st = citiesData[selected.countryKey][selected.stateIndex];
      
      // Validate coordinates
      if(fieldLat.value && !isValidCoord(fieldLat.value)) {
        return showToast('Latitude must be numeric');
      }
      if(fieldLon.value && !isValidCoord(fieldLon.value)) {
        return showToast('Longitude must be numeric');
      }
      
      // Build payload with only changed fields
      const payload = { 
        country: selected.countryKey, 
        stateName: st.name, 
        cityIndex: selected.cityIndex
      };
      
      let hasChanges = false;
      
      if(normalizeValue(fieldName.value) !== originalData.name) {
        payload.name = fieldName.value;
        hasChanges = true;
      }
      
      if(normalizeValue(fieldLink.value) !== originalData.link) {
        payload.link = fieldLink.value;
        hasChanges = true;
      }
      
      if(normalizeValue(fieldLat.value) !== originalData.lat) {
        payload.lat = fieldLat.value === '' ? '' : Number(fieldLat.value);
        hasChanges = true;
      }
      
      if(normalizeValue(fieldLon.value) !== originalData.lon) {
        payload.lon = fieldLon.value === '' ? '' : Number(fieldLon.value);
        hasChanges = true;
      }
      
      if(!hasChanges) {
        return showToast('No changes detected');
      }
      
      console.log('Sending city update:', payload);
      
      const res = await fetch('/api/city/update', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify(payload) 
      });
      
      const j = await res.json();
      
      if(!j.success) {
        console.error('City update failed:', j);
        return showToast('City update failed: ' + (j.error || res.status));
      }
      
      await loadCities();
      // Reselect using saved selection
      selectCity(savedSelection.countryKey, savedSelection.stateIndex, savedSelection.cityIndex);
      showToast('City updated successfully');
      
    } else if(selected.type === 'state'){
      const st = citiesData[selected.countryKey][selected.stateIndex];
      st.name = fieldName.value;
      st.code = fieldCode.value || '';
      await fetch('/api/cities', { method:'POST', headers: headersWithToken(), body: JSON.stringify(citiesData) });
      await loadCities();
      showToast('State updated');
    } else if(selected.type === 'country'){
      const oldKey = selected.countryKey;
      const newKey = (fieldCode.value || '').toString().trim().toUpperCase();
      if(!newKey) return showToast('Country key cannot be empty');
      
      if(newKey !== oldKey){
        const data = JSON.parse(JSON.stringify(citiesData));
        data[newKey] = data[oldKey];
        delete data[oldKey];
        
        if(data[newKey] && data[newKey][0]) {
          data[newKey][0].name = fieldName.value || data[newKey][0].name || newKey;
        }
        
        const resFull = await fetch('/api/cities', { method:'POST', headers: headersWithToken(), body: JSON.stringify(data) });
        if(!resFull.ok) return showToast('Failed to rename country: ' + resFull.status);
        await loadCities();
        showToast('Country renamed');
      } else {
        const firstState = citiesData[oldKey] && citiesData[oldKey][0];
        if(firstState) firstState.name = fieldName.value || firstState.name || oldKey;
        await fetch('/api/cities', { method:'POST', headers: headersWithToken(), body: JSON.stringify(citiesData) });
        await loadCities();
        showToast('Country updated');
      }
    }
  } catch (e) { 
    console.error('Update error:', e);
    showToast('Update failed: ' + e.message); 
  }
};

btnReset.onclick = ()=> { if(selected) showEditor(); };

async function loadCities(){
  if(!adminToken) return showToast('Paste admin token (click tiny padlock at top-right)');
  try {
    const res = await fetch('/api/cities', { headers: { 'x-admin-token': adminToken } });
    if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const j = await res.json();
    citiesData = j || {};
    internationalLinkInput.value = citiesData.INTERNATIONAL_LINK || '';
    selected = null;
    renderExplorer();
    showToast('Cities loaded');
  } catch(e) {
    showToast('Load failed: ' + e.message);
  }
}

btnAddCountry.addEventListener('click', addCountry);
btnReload.addEventListener('click', loadCities);

btnSaveIntlLink.addEventListener('click', async ()=> {
  if(!adminToken) return showToast('Admin token required');
  
  const newLink = internationalLinkInput.value.trim();
  if(!newLink) return showToast('International link cannot be empty');
  
  try {
    citiesData.INTERNATIONAL_LINK = newLink;
    const res = await fetch('/api/cities', { 
      method:'POST', 
      headers: headersWithToken(), 
      body: JSON.stringify(citiesData) 
    });
    
    if(!res.ok) throw new Error('Failed to save: ' + res.status);
    
    showToast('International link saved successfully');
  } catch(e) {
    showToast('Save failed: ' + e.message);
  }
});

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

renderExplorer();
showEditor();
