<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model Admin – Dark Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --muted: #9aa7b2; }
    body { background: linear-gradient(180deg,#041023 0%, #071827 100%); }
    .glass { background: rgba(255,255,255,0.02); }
    .muted { color: var(--muted); }
    #tokenHotspot { position: fixed; right: 16px; top: 12px; width: 28px; height: 28px; z-index: 60; border-radius: 6px; }
    #tokenHotspot:hover { outline: 2px solid rgba(255,255,255,0.03); cursor: pointer; }
    .chevron { 
      transition: transform 0.2s ease;
      display: inline-block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .chevron.collapsed { transform: rotate(-90deg); }
  </style>
</head>
<body class="text-slate-100 font-inter antialiased">
  <div class="max-w-7xl mx-auto p-6">
    <header class="flex items-center gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-semibold">Model Management – Admin</h1>
        <p class="muted text-sm">Model → Country → State → City. All collapsible hierarchy.</p>
      </div>

      <div class="flex-1"></div>

      <div id="tokenHotspot" class="cursor-pointer" title="Click to set token">
        <svg class="h-6 w-6 text-white/40 hover:text-white/70 transition" 
             viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 15v2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="4" y="10" width="16" height="10" rx="2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 10V7a4 4 0 018 0v3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </header>

    <main class="grid grid-cols-12 gap-6">
      <section class="col-span-7 glass rounded-xl p-4 h-[75vh] overflow-auto">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm muted">Explorer</div>
          <div class="flex gap-2">
            <button id="btnAddModel" class="px-3 py-1 rounded bg-purple-600 hover:bg-purple-700 text-sm">+ Model</button>
            <button id="btnReload" class="px-3 py-1 rounded bg-white/5 text-sm">Reload</button>
          </div>
        </div>

        <div id="listBox" class="space-y-3"></div>
      </section>

      <section class="col-span-5 glass rounded-xl p-5 h-[75vh] overflow-auto">
        <div id="editorEmpty" class="h-full flex flex-col items-center justify-center muted">
          <div class="text-lg">No item selected</div>
          <div class="text-sm mt-2">Select an item from the left to edit.</div>
        </div>

        <div id="editorPanel" class="hidden">
          <div class="flex items-center justify-between mb-3">
            <div>
              <div id="editPath" class="text-xs muted"></div>
              <h2 id="editTitle" class="text-xl font-semibold"></h2>
            </div>
            <div class="flex gap-2">
              <button id="btnAddChild" class="px-3 py-1 rounded bg-emerald-600 text-sm hidden">Add Child</button>
              <button id="btnDelete" class="px-3 py-1 rounded bg-red-600 text-sm">Delete</button>
            </div>
          </div>

          <div class="space-y-3">
            <div id="modelFields" class="hidden space-y-3">
              <div>
                <label class="text-xs muted">Model Name</label>
                <input id="fieldModelName" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              </div>
              <div>
                <label class="text-xs muted">Default Link</label>
                <input id="fieldDefaultLink" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              </div>
            </div>

            <div id="countryFields" class="hidden space-y-3">
              <div>
                <label class="text-xs muted">Country Code</label>
                <input id="fieldCountryCode" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" placeholder="US, BD, etc." />
              </div>
            </div>

            <div id="stateFields" class="hidden space-y-3">
              <div>
                <label class="text-xs muted">State/Region Name</label>
                <input id="fieldStateName" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              </div>
              <div>
                <label class="text-xs muted">State Code (optional)</label>
                <input id="fieldStateCode" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              </div>
            </div>

            <div id="cityFields" class="hidden space-y-3">
              <div>
                <label class="text-xs muted">City Name</label>
                <input id="fieldCityName" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs muted">Latitude</label>
                  <input id="fieldLat" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
                </div>
                <div>
                  <label class="text-xs muted">Longitude</label>
                  <input id="fieldLon" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
                </div>
              </div>
              <div>
                <label class="text-xs muted">Custom Link (leave empty to use model default)</label>
                <input id="fieldCityLink" class="w-full px-3 py-2 rounded bg-transparent border border-white/6" />
              </div>
            </div>

            <div class="flex items-center gap-3">
              <button id="btnUpdate" class="px-4 py-2 rounded bg-blue-600">Update</button>
              <button id="btnReset" class="px-4 py-2 rounded border border-white/10">Reset</button>
            </div>

            <div>
              <label class="text-xs muted">Raw JSON</label>
              <pre id="rawPreview" class="bg-black/30 text-xs p-3 rounded max-h-48 overflow-auto"></pre>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="fixed right-6 bottom-6 hidden items-center gap-3 bg-slate-900/80 border border-white/6 text-sm px-4 py-3 rounded">
    <div id="toastText"></div>
    <button id="toastClose" class="text-white/60">✕</button>
  </div>

  <div id="tokenPanel" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-slate-900 border border-white/10 rounded-lg p-6 max-w-md w-full mx-4">
      <h3 class="text-lg font-semibold mb-3">Admin Token</h3>
      <input id="tokenVisible" type="password" class="w-full px-3 py-2 rounded bg-transparent border border-white/6 mb-4" placeholder="Enter admin token" />
      <div class="flex gap-2 justify-end">
        <button id="btnTokenCancel" class="px-4 py-2 rounded border border-white/10">Cancel</button>
        <button id="btnTokenSave" class="px-4 py-2 rounded bg-blue-600">Save & Load</button>
      </div>
    </div>
  </div>

<script>
let appData = null;
let selected = null;
let adminToken = localStorage.getItem('adminToken') || null;
let originalData = null;
let collapsed = {
  models: new Set(),
  countries: new Set(),
  states: new Set()
};

const listBox = document.getElementById('listBox');
const btnAddModel = document.getElementById('btnAddModel');
const btnReload = document.getElementById('btnReload');

const editorEmpty = document.getElementById('editorEmpty');
const editorPanel = document.getElementById('editorPanel');
const editPath = document.getElementById('editPath');
const editTitle = document.getElementById('editTitle');

const modelFields = document.getElementById('modelFields');
const fieldModelName = document.getElementById('fieldModelName');
const fieldDefaultLink = document.getElementById('fieldDefaultLink');

const countryFields = document.getElementById('countryFields');
const fieldCountryCode = document.getElementById('fieldCountryCode');

const stateFields = document.getElementById('stateFields');
const fieldStateName = document.getElementById('fieldStateName');
const fieldStateCode = document.getElementById('fieldStateCode');

const cityFields = document.getElementById('cityFields');
const fieldCityName = document.getElementById('fieldCityName');
const fieldLat = document.getElementById('fieldLat');
const fieldLon = document.getElementById('fieldLon');
const fieldCityLink = document.getElementById('fieldCityLink');
const rawPreview = document.getElementById('rawPreview');

const btnAddChild = document.getElementById('btnAddChild');
const btnDelete = document.getElementById('btnDelete');
const btnUpdate = document.getElementById('btnUpdate');
const btnReset = document.getElementById('btnReset');

const tokenHotspot = document.getElementById('tokenHotspot');
const tokenPanel = document.getElementById('tokenPanel');
const tokenVisible = document.getElementById('tokenVisible');
const btnTokenSave = document.getElementById('btnTokenSave');
const btnTokenCancel = document.getElementById('btnTokenCancel');

const toast = document.getElementById('toast');
const toastText = document.getElementById('toastText');
const toastClose = document.getElementById('toastClose');

function showToast(msg, t=3000){
  toastText.textContent = msg;
  toast.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.add('hidden'), t);
}
toastClose.onclick = ()=> { toast.classList.add('hidden'); clearTimeout(toast._t); };

function isValidCoord(x){ 
  return x === '' || x === null || x === undefined || /^-?\d+(\.\d+)?$/.test(String(x).trim()); 
}
function headersWithToken(){
  return { 'Content-Type': 'application/json', 'x-admin-token': adminToken || '' };
}
function normalizeValue(val) {
  if (val === null || val === undefined || val === '') return '';
  return String(val);
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

tokenHotspot.addEventListener('click', ()=> {
  tokenPanel.classList.remove('hidden');
  tokenPanel.classList.add('flex');
  tokenVisible.focus();
});

btnTokenSave.addEventListener('click', ()=> {
  adminToken = tokenVisible.value.trim();
  if(adminToken) {
    localStorage.setItem('adminToken', adminToken);
    tokenPanel.classList.add('hidden');
    tokenPanel.classList.remove('flex');
    loadData();
  }
});

btnTokenCancel.addEventListener('click', ()=> {
  tokenPanel.classList.add('hidden');
  tokenPanel.classList.remove('flex');
});

tokenVisible.addEventListener('keydown', (e)=> {
  if(e.key === 'Enter') btnTokenSave.click();
  if(e.key === 'Escape') btnTokenCancel.click();
});

function renderExplorer(){
  listBox.innerHTML = '';
  
  if(!appData){ 
    listBox.innerHTML = '<div class="muted text-sm">No data loaded</div>'; 
    return; 
  }

  const modelNames = Object.keys(appData);
  if(modelNames.length === 0) { 
    listBox.innerHTML = '<div class="muted text-sm">No models</div>'; 
    return; 
  }

  modelNames.forEach(modelName => {
    const model = appData[modelName];
    const modelKey = modelName;
    const isModelCollapsed = collapsed.models.has(modelKey);
    
    const modelBox = document.createElement('div');
    modelBox.className = 'border border-purple-500/30 rounded-lg overflow-hidden mb-3';
    
    // Model Header
    const modelHeader = document.createElement('div');
    modelHeader.className = 'p-3 hover:bg-white/2 flex items-center gap-3';
    if(selected && selected.type==='model' && selected.modelName===modelName) {
      modelHeader.classList.add('ring-2','ring-purple-600','bg-white/2');
    }
    
    const chevronDiv = document.createElement('div');
    chevronDiv.className = 'cursor-pointer';
    chevronDiv.onclick = ()=> {
      if(isModelCollapsed) collapsed.models.delete(modelKey);
      else collapsed.models.add(modelKey);
      renderExplorer();
    };
    
    const chevron = document.createElement('svg');
    chevron.className = `chevron text-purple-400 ${isModelCollapsed ? 'collapsed' : ''}`;
    chevron.setAttribute('viewBox', '0 0 24 24');
    chevron.setAttribute('fill', 'none');
    chevron.setAttribute('stroke', 'currentColor');
    chevron.setAttribute('stroke-width', '2');
    chevron.innerHTML = '<path d="M6 9l6 6 6-6"/>';
    chevronDiv.appendChild(chevron);
    
    const modelInfo = document.createElement('div');
    modelInfo.className = 'flex-1 cursor-pointer';
    const countryCount = Object.keys(model.countries || {}).length;
    modelInfo.innerHTML = `<div class="font-medium text-purple-400">${escapeHtml(modelName)}</div><div class="text-xs muted">${countryCount} countries • ${escapeHtml(model.default_link || '-')}</div>`;
    modelInfo.onclick = ()=> selectModel(modelName);
    
    const addCountryBtn = document.createElement('button');
    addCountryBtn.className='text-sm px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-700';
    addCountryBtn.textContent='+ Country';
    addCountryBtn.onclick = (e)=> { e.stopPropagation(); addCountry(modelName); };
    
    modelHeader.appendChild(chevronDiv);
    modelHeader.appendChild(modelInfo);
    modelHeader.appendChild(addCountryBtn);
    modelBox.appendChild(modelHeader);

    // Countries
    if(!isModelCollapsed && model.countries) {
      Object.keys(model.countries).forEach(countryCode => {
        const countryKey = `${modelName}-${countryCode}`;
        const isCountryCollapsed = collapsed.countries.has(countryKey);
        const states = model.countries[countryCode];
        
        const countryDiv = document.createElement('div');
        countryDiv.className = 'ml-4 border-l-2 border-white/10';
        
        const countryHeader = document.createElement('div');
        countryHeader.className = 'p-2 hover:bg-white/3 flex items-center gap-2';
        if(selected && selected.type==='country' && selected.modelName===modelName && selected.countryCode===countryCode) {
          countryHeader.classList.add('ring-2','ring-blue-600','bg-white/3');
        }
        
        const cChevronDiv = document.createElement('div');
        cChevronDiv.className = 'cursor-pointer';
        cChevronDiv.onclick = ()=> {
          if(isCountryCollapsed) collapsed.countries.delete(countryKey);
          else collapsed.countries.add(countryKey);
          renderExplorer();
        };
        
        const cChevron = document.createElement('svg');
        cChevron.className = `chevron text-blue-400 ${isCountryCollapsed ? 'collapsed' : ''}`;
        cChevron.setAttribute('viewBox', '0 0 24 24');
        cChevron.setAttribute('fill', 'none');
        cChevron.setAttribute('stroke', 'currentColor');
        cChevron.setAttribute('stroke-width', '2');
        cChevron.innerHTML = '<path d="M6 9l6 6 6-6"/>';
        cChevronDiv.appendChild(cChevron);
        
        const countryInfo = document.createElement('div');
        countryInfo.className = 'flex-1 cursor-pointer';
        countryInfo.innerHTML = `<div class="font-medium text-sm">${escapeHtml(countryCode)}</div><div class="text-xs muted">${Array.isArray(states) ? states.length : 0} states</div>`;
        countryInfo.onclick = ()=> selectCountry(modelName, countryCode);
        
        const addStateBtn = document.createElement('button');
        addStateBtn.className='text-sm px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-700';
        addStateBtn.textContent='+ State';
        addStateBtn.onclick = (e)=> { e.stopPropagation(); addState(modelName, countryCode); };
        
        countryHeader.appendChild(cChevronDiv);
        countryHeader.appendChild(countryInfo);
        countryHeader.appendChild(addStateBtn);
        countryDiv.appendChild(countryHeader);
        
        // States
        if(!isCountryCollapsed && Array.isArray(states)) {
          states.forEach((state, si) => {
            const stateKey = `${modelName}-${countryCode}-${si}`;
            const isStateCollapsed = collapsed.states.has(stateKey);
            
            const stateDiv = document.createElement('div');
            stateDiv.className = 'ml-4 border-l-2 border-white/10';
            
            const stateHeader = document.createElement('div');
            stateHeader.className = 'p-2 hover:bg-white/4 flex items-center gap-2';
            if(selected && selected.type==='state' && selected.modelName===modelName && selected.countryCode===countryCode && selected.stateIndex===si) {
              stateHeader.classList.add('ring-2','ring-blue-500','bg-white/4');
            }
            
            const sChevronDiv = document.createElement('div');
            sChevronDiv.className = 'cursor-pointer';
            sChevronDiv.onclick = ()=> {
              if(isStateCollapsed) collapsed.states.delete(stateKey);
              else collapsed.states.add(stateKey);
              renderExplorer();
            };
            
            const sChevron = document.createElement('svg');
            sChevron.className = `chevron text-blue-300 ${isStateCollapsed ? 'collapsed' : ''}`;
            sChevron.setAttribute('viewBox', '0 0 24 24');
            sChevron.setAttribute('fill', 'none');
            sChevron.setAttribute('stroke', 'currentColor');
            sChevron.setAttribute('stroke-width', '2');
            sChevron.innerHTML = '<path d="M6 9l6 6 6-6"/>';
            sChevronDiv.appendChild(sChevron);
            
            const stateInfo = document.createElement('div');
            stateInfo.className = 'flex-1 cursor-pointer';
            stateInfo.innerHTML = `<div class="font-medium text-sm">${escapeHtml(state.name || '(unnamed)')}</div><div class="text-xs muted">${Array.isArray(state.cities) ? state.cities.length : 0} cities</div>`;
            stateInfo.onclick = ()=> selectState(modelName, countryCode, si);
            
            const addCityBtn = document.createElement('button');
            addCityBtn.className='text-sm px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-700';
            addCityBtn.textContent='+ City';
            addCityBtn.onclick = (e)=> { e.stopPropagation(); addCity(modelName, countryCode, si); };
            
            stateHeader.appendChild(sChevronDiv);
            stateHeader.appendChild(stateInfo);
            stateHeader.appendChild(addCityBtn);
            stateDiv.appendChild(stateHeader);
            
            // Cities
            if(!isStateCollapsed && Array.isArray(state.cities)) {
              state.cities.forEach((city, ci) => {
                const cityDiv = document.createElement('div');
                cityDiv.className = 'ml-8 p-2 rounded hover:bg-white/5 cursor-pointer';
                if(selected && selected.type==='city' && selected.modelName===modelName && selected.countryCode===countryCode && selected.stateIndex===si && selected.cityIndex===ci) {
                  cityDiv.classList.add('ring-2','ring-indigo-500','bg-white/5');
                }
                
                const linkText = city.link && city.link.trim() ? city.link : '(default)';
                cityDiv.innerHTML = `<div class="font-medium text-sm">${escapeHtml(city.name||'(unnamed)')}</div><div class="text-xs muted">${escapeHtml(String(city.lat||'-'))}, ${escapeHtml(String(city.lon||'-'))} • ${escapeHtml(linkText)}</div>`;
                cityDiv.onclick = ()=> selectCity(modelName, countryCode, si, ci);
                stateDiv.appendChild(cityDiv);
              });
            }
            
            countryDiv.appendChild(stateDiv);
          });
        }
        
        modelBox.appendChild(countryDiv);
      });
    }

    listBox.appendChild(modelBox);
  });
}

function selectModel(modelName){
  selected = { type:'model', modelName };
  showEditor();
  renderExplorer();
}

function selectCountry(modelName, countryCode){
  selected = { type:'country', modelName, countryCode };
  showEditor();
  renderExplorer();
}

function selectState(modelName, countryCode, stateIndex){
  selected = { type:'state', modelName, countryCode, stateIndex };
  showEditor();
  renderExplorer();
}

function selectCity(modelName, countryCode, stateIndex, cityIndex){
  selected = { type:'city', modelName, countryCode, stateIndex, cityIndex };
  showEditor();
  renderExplorer();
}

function showEditor(){
  if(!selected){ 
    editorPanel.classList.add('hidden'); 
    editorEmpty.classList.remove('hidden'); 
    originalData = null;
    return; 
  }
  editorEmpty.classList.add('hidden'); 
  editorPanel.classList.remove('hidden');

  modelFields.classList.add('hidden');
  countryFields.classList.add('hidden');
  stateFields.classList.add('hidden');
  cityFields.classList.add('hidden');
  btnAddChild.classList.add('hidden');

  if(selected.type==='model'){
    const model = appData[selected.modelName];
    editPath.textContent = `Model`;
    editTitle.textContent = selected.modelName;
    modelFields.classList.remove('hidden');
    btnAddChild.classList.remove('hidden');
    btnAddChild.textContent = '+ Country';
    fieldModelName.value = selected.modelName;
    fieldDefaultLink.value = model.default_link || '';
    rawPreview.textContent = JSON.stringify(model, null, 2);
    originalData = { name: selected.modelName, default_link: model.default_link || '' };
    
  } else if(selected.type==='country'){
    editPath.textContent = `${selected.modelName} • ${selected.countryCode}`;
    editTitle.textContent = selected.countryCode;
    countryFields.classList.remove('hidden');
    btnAddChild.classList.remove('hidden');
    btnAddChild.textContent = '+ State';
    fieldCountryCode.value = selected.countryCode;
    rawPreview.textContent = JSON.stringify(appData[selected.modelName].countries[selected.countryCode], null, 2);
    originalData = { code: selected.countryCode };
    
  } else if(selected.type==='state'){
    const state = appData[selected.modelName].countries[selected.countryCode][selected.stateIndex];
    editPath.textContent = `${selected.modelName} • ${selected.countryCode} • ${selected.stateIndex}`;
    editTitle.textContent = state.name || 'State';
    stateFields.classList.remove('hidden');
    btnAddChild.classList.remove('hidden');
    btnAddChild.textContent = '+ City';
    fieldStateName.value = state.name || '';
    fieldStateCode.value = state.code || '';
    rawPreview.textContent = JSON.stringify(state, null, 2);
    originalData = { name: state.name || '', code: state.code || '' };
    
  } else if(selected.type==='city'){
    const city = appData[selected.modelName].countries[selected.countryCode][selected.stateIndex].cities[selected.cityIndex];
    editPath.textContent = `${selected.modelName} • ${selected.countryCode} • ${selected.stateIndex} • ${selected.cityIndex}`;
    editTitle.textContent = city.name || 'City';
    cityFields.classList.remove('hidden');
    fieldCityName.value = city.name || '';
    fieldLat.value = normalizeValue(city.lat);
    fieldLon.value = normalizeValue(city.lon);
    fieldCityLink.value = city.link || '';
    rawPreview.textContent = JSON.stringify(city, null, 2);
    originalData = { 
      name: city.name || '',
      lat: normalizeValue(city.lat), 
      lon: normalizeValue(city.lon),
      link: city.link || ''
    };
  }
}

async function addModel(){
  const name = prompt('Model name (e.g. model1, premium)');
  if(!name) return;
  const default_link = prompt('Default link');
  if(!default_link) return;
  
  try {
    const res = await fetch('/api/model/add', { 
      method: 'POST', 
      headers: headersWithToken(), 
      body: JSON.stringify({ name, default_link }) 
    });
    const j = await res.json();
    if(!j.success) return showToast('Add model failed: ' + (j.error || res.status));
    await loadData();
    selectModel(name);
    showToast('Model added');
  } catch(e) { showToast('Add model error: ' + e.message); }
}

async function addCountry(modelName){
  const code = prompt('Country code (e.g. US, BD)');
  if(!code) return;
  
  try {
    const res = await fetch('/api/country/add', { 
      method:'POST', 
      headers: headersWithToken(), 
      body: JSON.stringify({ model: modelName, code: code.toUpperCase() }) 
    });
    const j = await res.json();
    if(!j.success) return showToast('Add country failed: ' + (j.error || res.status));
    await loadData();
    selectCountry(modelName, code.toUpperCase());
    showToast('Country added');
  } catch(e){ showToast('Add country error: ' + e.message); }
}

async function addState(modelName, countryCode){
  const name = prompt('State/region name');
  if(!name) return;
  const code = prompt('State code (optional)') || '';
  
  try {
    const res = await fetch('/api/state/add', { 
      method:'POST', 
      headers: headersWithToken(), 
      body: JSON.stringify({ model: modelName, country: countryCode, name, code }) 
    });
    const j = await res.json();
    if(!j.success) return showToast('Add state failed: ' + (j.error || res.status));
    await loadData();
    const states = appData[modelName].countries[countryCode] || [];
    selectState(modelName, countryCode, states.length - 1);
    showToast('State added');
  } catch(e){ showToast('Add state error: ' + e.message); }
}

async function addCity(modelName, countryCode, stateIndex){
  const name = prompt('City name');
  if(!name) return;
  const lat = prompt('Latitude (optional)') || '';
  const lon = prompt('Longitude (optional)') || '';
  const link = prompt('Custom link (leave empty for model default)') || '';
  
  try {
    const res = await fetch('/api/city/add', { 
      method:'POST', 
      headers: headersWithToken(), 
      body: JSON.stringify({ 
        model: modelName,
        country: countryCode,
        stateIndex,
        name, 
        lat: lat === '' ? '' : Number(lat), 
        lon: lon === '' ? '' : Number(lon), 
        link
      })
    });
    const j = await res.json();
    if(!j.success) return showToast('Add city failed: ' + (j.error || res.status));
    await loadData();
    const cities = appData[modelName].countries[countryCode][stateIndex].cities || [];
    selectCity(modelName, countryCode, stateIndex, cities.length - 1);
    showToast('City added');
  } catch(e){ showToast('Add city error: ' + e.message); }
}

btnAddModel.onclick = addModel;

btnAddChild.onclick = ()=> {
  if(!selected) return;
  if(selected.type === 'model') addCountry(selected.modelName);
  else if(selected.type === 'country') addState(selected.modelName, selected.countryCode);
  else if(selected.type === 'state') addCity(selected.modelName, selected.countryCode, selected.stateIndex);
};

btnDelete.onclick = async ()=> {
  if(!selected) return showToast('Select something to delete');
  if(!confirm('Delete selected item?')) return;
  
  try {
    if(selected.type === 'model'){
      const res = await fetch('/api/model/delete', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify({ name: selected.modelName }) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Delete failed: ' + (j.error || res.status));
      selected = null;
      await loadData();
      showToast('Model deleted');
      
    } else if(selected.type === 'country'){
      const res = await fetch('/api/country/delete', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify({ model: selected.modelName, code: selected.countryCode }) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Delete failed: ' + (j.error || res.status));
      selected = null;
      await loadData();
      showToast('Country deleted');
      
    } else if(selected.type === 'state'){
      const res = await fetch('/api/state/delete', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify({ model: selected.modelName, country: selected.countryCode, stateIndex: selected.stateIndex }) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Delete failed: ' + (j.error || res.status));
      selected = null;
      await loadData();
      showToast('State deleted');
      
    } else if(selected.type === 'city'){
      const res = await fetch('/api/city/delete', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify({ 
          model: selected.modelName,
          country: selected.countryCode,
          stateIndex: selected.stateIndex,
          cityIndex: selected.cityIndex
        }) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Delete failed: ' + (j.error || res.status));
      selected = null;
      await loadData();
      showToast('City deleted');
    }
  } catch(e){ showToast('Delete error: ' + e.message); }
};

btnUpdate.onclick = async ()=> {
  if(!selected) return showToast('Select an item to update');
  
  const savedSelection = { ...selected };
  
  try {
    if(selected.type === 'model'){
      const oldName = selected.modelName;
      const newName = fieldModelName.value.trim();
      const newDefaultLink = fieldDefaultLink.value.trim();
      
      if(!newName || !newDefaultLink) return showToast('All fields required');
      
      let hasChanges = newName !== oldName || newDefaultLink !== originalData.default_link;
      if(!hasChanges) return showToast('No changes');
      
      const res = await fetch('/api/model/update', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify({ oldName, name: newName, default_link: newDefaultLink }) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Update failed: ' + (j.error || res.status));
      
      await loadData();
      selectModel(newName);
      showToast('Model updated');
      
    } else if(selected.type === 'city'){
      if(fieldLat.value && !isValidCoord(fieldLat.value)) return showToast('Invalid latitude');
      if(fieldLon.value && !isValidCoord(fieldLon.value)) return showToast('Invalid longitude');
      
      const payload = { 
        model: selected.modelName,
        country: selected.countryCode,
        stateIndex: selected.stateIndex,
        cityIndex: selected.cityIndex
      };
      
      let hasChanges = false;
      if(normalizeValue(fieldCityName.value) !== originalData.name) { payload.name = fieldCityName.value; hasChanges = true; }
      if(normalizeValue(fieldLat.value) !== originalData.lat) { payload.lat = fieldLat.value === '' ? '' : Number(fieldLat.value); hasChanges = true; }
      if(normalizeValue(fieldLon.value) !== originalData.lon) { payload.lon = fieldLon.value === '' ? '' : Number(fieldLon.value); hasChanges = true; }
      if(normalizeValue(fieldCityLink.value) !== originalData.link) { payload.link = fieldCityLink.value; hasChanges = true; }
      
      if(!hasChanges) return showToast('No changes');
      
      const res = await fetch('/api/city/update', { 
        method:'POST', 
        headers: headersWithToken(), 
        body: JSON.stringify(payload) 
      });
      const j = await res.json();
      if(!j.success) return showToast('Update failed: ' + (j.error || res.status));
      
      await loadData();
      selectCity(savedSelection.modelName, savedSelection.countryCode, savedSelection.stateIndex, savedSelection.cityIndex);
      showToast('City updated');
      
    } else if(selected.type === 'state'){
      // Update via full data save for now
      const state = appData[selected.modelName].countries[selected.countryCode][selected.stateIndex];
      state.name = fieldStateName.value;
      state.code = fieldStateCode.value || '';
      await fetch('/api/data', { method:'POST', headers: headersWithToken(), body: JSON.stringify(appData) });
      await loadData();
      showToast('State updated');
    }
  } catch (e) { 
    showToast('Update failed: ' + e.message); 
  }
};

btnReset.onclick = ()=> { if(selected) showEditor(); };

async function loadData(){
  if(!adminToken) {
    tokenPanel.classList.remove('hidden');
    tokenPanel.classList.add('flex');
    return showToast('Admin token required');
  }
  
  try {
    const res = await fetch('/api/data', { 
      headers: { 'x-admin-token': adminToken } 
    });
    if(!res.ok) throw new Error(res.status);
    appData = await res.json();
    selected = null;
    renderExplorer();
    showToast('Data loaded');
  } catch(e) {
    showToast('Load failed: ' + e.message);
  }
}

btnReload.addEventListener('click', loadData);

if(adminToken) loadData();
else { renderExplorer(); showEditor(); }
</script>
</body>
